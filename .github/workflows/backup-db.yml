name: Backup de la base de datos (Supabase)

# Corre en la nube (GitHub Actions), no depende de que ninguna PC esté
# encendida. Dos formas de disparo:
#   - schedule: todos los días a las 08:00 UTC (~04:00 hora Bolivia).
#   - workflow_dispatch: botón "Run workflow" en la pestaña Actions de
#     GitHub, para que el administrador pueda pedir un backup manual
#     cuando quiera, sin instalar nada en su PC.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write # necesario para poder crear el Release con el backup

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar el dump (esquema + datos)
        env:
          PGPASSWORD: ${{ secrets.DB_PASS }}
        run: |
          set -e
          FECHA=$(date +%Y-%m-%d)
          mkdir -p backup
          # Puerto 5432 del pooler de Supabase (modo "session"), no el 6543
          # (modo "transaction") -- pg_dump necesita modo session.
          pg_dump \
            --host="${{ secrets.DB_HOST }}" \
            --port=5432 \
            --username="${{ secrets.DB_USER }}" \
            --dbname="${{ secrets.DB_NAME }}" \
            --schema=public \
            --no-owner --no-privileges \
            --clean --if-exists \
            -f "backup/arenagym_${FECHA}.sql"
          gzip "backup/arenagym_${FECHA}.sql"
          echo "FECHA=${FECHA}" >> "$GITHUB_ENV"

      - name: Publicar el backup como GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "backup-${FECHA}" \
            "backup/arenagym_${FECHA}.sql.gz" \
            --title "Backup ArenaGym - ${FECHA}" \
            --notes "Backup automático de la base de datos (esquema + datos). Para restaurar: \`gunzip\` y luego \`psql -f arenagym_${FECHA}.sql\`."

      - name: Borrar backups de más de 30 días (rotación)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMITE=$(date -d '30 days ago' +%Y-%m-%d)
          gh release list --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"backup-\")) | select(.createdAt < \"${LIMITE}\") | .tagName" \
            | while read -r TAG; do
                echo "Borrando release antiguo: ${TAG}"
                gh release delete "${TAG}" --yes --cleanup-tag || true
              done
